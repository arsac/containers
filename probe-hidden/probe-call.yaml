---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Probe Call

on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
      release:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/image-builder.yaml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
      security-events: write
    secrets:
      BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    with:
      image: ${{ inputs.image }}
      release: ${{ inputs.release }}

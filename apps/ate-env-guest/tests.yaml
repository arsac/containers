---
# container-structure-test spec (run by .github/actions/app-tests per arch).
# Pins the ko layout Substrate depends on: ActorTemplates run
# /ko-app/ate-env-guest, and rootfs mode runs <mount>/ko-app/ate-env-guest, so
# the binary must stay at that path and be static.
schemaVersion: "2.0.0"

metadataTest:
  entrypoint: ["/ko-app/ate-env-guest"]
  labels:
    - key: org.opencontainers.image.licenses
      value: Apache-2.0
    - key: org.opencontainers.image.source
      value: https://github.com/agent-substrate/env

fileExistenceTests:
  - name: guest at the ko path
    path: /ko-app/ate-env-guest
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: upstream license shipped
    path: /usr/share/doc/ate-env/LICENSE
    shouldExist: true

commandTests:
  - name: guest starts
    command: /ko-app/ate-env-guest
    args: ["-help"]
    exitCode: 0
  # ldd exits non-zero on a static binary; a dynamic one would fail to run
  # from a foreign rootfs.
  - name: guest is static
    command: /bin/sh
    args: ["-c", "! ldd /ko-app/ate-env-guest"]
    exitCode: 0

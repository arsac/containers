name: Publish (Forgejo)

# Builds every CHANGED app under apps/ and pushes to the INTERNAL LAN registry so
# the cluster pulls quickly. Per-app platforms/refs/versions live in each app's
# docker-bake.hcl (kserve = amd64-only; honcho-mcp = amd64,arm64), so this
# workflow is app-agnostic — a new app needs only apps/<name>/{Dockerfile,
# docker-bake.hcl}, no change here.
#
# The registry host is derived at runtime from the forge URL (GITHUB_SERVER_URL)
# so the internal hostname never lands in this public repo. Must run on the
# in-cluster runner (the registry is internal). Pull mirrors do NOT auto-trigger
# Actions — use workflow_dispatch (optionally naming a single app) or push to the
# internal remote.
#
# Required secret: PACKAGE_TOKEN (push credential).

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to publish (blank = auto-detect changed apps)"
        required: false
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".forgejo/workflows/publish.yaml"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine apps to build
        id: changed
        env:
          APP_INPUT: ${{ github.event.inputs.app }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Manual override: build exactly the named app.
          if [ -n "${APP_INPUT}" ]; then
            echo "apps=[\"${APP_INPUT}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Otherwise diff this push and keep changed top-level apps/<name>/ dirs
          # that are publishable (have a docker-bake.hcl).
          base="${BEFORE}"
          if [ -z "${base}" ] || ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "${base}" "${SHA}" \
            | awk -F/ '$1=="apps" && NF>=2 {print $2}' | sort -u)"
          apps="[]"
          if [ -n "${changed}" ]; then
            matched=""
            while IFS= read -r app; do
              [ -n "${app}" ] || continue
              if [ -f "apps/${app}/docker-bake.hcl" ]; then
                matched="${matched}${app}"$'\n'
              fi
            done <<< "${changed}"
            if [ -n "${matched}" ]; then
              apps="$(printf '%s' "${matched}" | jq -R . | jq -cs .)"
            fi
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Building: ${apps}"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]' && needs.detect.outputs.apps != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Get CalVer tag
        id: calver
        run: echo "tag=$(date +'%Y.%m.%d')-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Resolve registry host
        id: reg
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - uses: docker/bake-action@v6
        id: bake
        with:
          workdir: apps/${{ matrix.app }}
          targets: forgejo
          push: true
        env:
          TAG: ${{ steps.calver.outputs.tag }}
          REGISTRY: ${{ steps.reg.outputs.host }}/arsac
          SOURCE: ${{ github.server_url }}/${{ github.repository }}

      - name: Emit image digest
        run: |
          echo "### ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.bake.outputs.metadata }}' \
            | jq -r '.forgejo["containerimage.digest"] // "digest not found"' \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

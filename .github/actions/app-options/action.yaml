---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Options
description: Takes an app and returns various fields from its docker-bake.hcl file

inputs:
  app:
    description: App Name
    required: true

outputs:
  platforms:
    description: Platforms
    value: ${{ steps.options.outputs.platforms }}
  source:
    description: Source
    value: ${{ steps.options.outputs.source }}
  version:
    description: Version
    value: ${{ steps.options.outputs.version }}
  free-disk-space:
    description: Whether to free disk space before building (default true)
    value: ${{ steps.options.outputs.free-disk-space }}
  exact-tag:
    description: Whether VERSION is published as the only tag (default false)
    value: ${{ steps.options.outputs.exact-tag }}

runs:
  using: composite
  steps:
    - name: App Options
      id: options
      shell: bash
      working-directory: ./apps/${{ inputs.app }}
      run: |
        PLATFORMS=$(\
            docker buildx bake image-all --print --progress=quiet \
                | jq --raw-output --compact-output '.target."image-all".platforms' \
        )
        SOURCE=$(\
            docker buildx bake --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "SOURCE") | .value' \
        )
        VERSION=$(\
            docker buildx bake --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "VERSION") | .value' \
        )

        FREE_DISK_SPACE=$(\
            docker buildx bake --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "FREE_DISK_SPACE") | .value' \
        )
        FREE_DISK_SPACE="${FREE_DISK_SPACE:-true}"

        EXACT_TAG=$(\
            docker buildx bake --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "EXACT_TAG") | .value' \
        )
        EXACT_TAG="${EXACT_TAG:-false}"

        echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
        echo "source=${SOURCE}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "free-disk-space=${FREE_DISK_SPACE}" >> $GITHUB_OUTPUT
        echo "exact-tag=${EXACT_TAG}" >> $GITHUB_OUTPUT

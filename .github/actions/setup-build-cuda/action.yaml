name: Set up Runner for build
description: Sets up the GitHub Actions runner with CUDA and Python for building packages.
inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  cuda-version:
    description: CUDA version to install
    required: false
    default: "12.9.1"
  torch-version:
    description: Torch version to pin (empty installs latest from torch-index)
    required: false
    default: ""
  torch-index:
    description: PyTorch wheel index to install from
    required: false
    default: "https://download.pytorch.org/whl/nightly/cu128"
  torch-companions:
    description: Pinned companion packages (e.g. "torchvision==0.26.0 torchaudio==2.11.0")
    required: false
    default: ""
  working-directory:
    description: Directory to run the action in
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Free up disk space
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      # https://github.com/easimon/maximize-build-space/blob/master/action.yml
      # https://github.com/easimon/maximize-build-space/tree/test-report
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    # - name: Set up swap space
    #   if: ${{ !env.ACT }} && runner.os == 'Linux'
    #   uses: pierotofy/set-swap-space@v1.0
    #   with:
    #     swap-size-gb: 10

    - name: Cache CUDA installer
      id: cache-cuda
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cuda.run
        key: cuda-${{ inputs.cuda-version }}-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          cuda-${{ inputs.cuda-version }}-${{ runner.os }}-

    - name: Download CUDA installer
      shell: bash
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      run: |
        wget https://developer.download.nvidia.com/compute/cuda/12.9.1/local_installers/cuda_12.9.1_575.57.08_linux.run -O cuda.run

    - name: Install CUDA toolkit
      shell: bash
      run: |
        sudo apt-get update
        # python dev headers: the uv-managed interpreter does not expose
        # Python.h on the compiler include path, which torch extension
        # builds require. python-version is effectively pinned to 3.12:
        # python3.12-dev is the only dev package this runner ships.
        sudo apt-get install -y --no-install-recommends build-essential wget git python3.12-dev

        # Use cached installer
        chmod +x cuda.run
        sudo ./cuda.run --silent --toolkit

        echo "CUDA_HOME=/usr/local/cuda" >> ${GITHUB_ENV}
        echo "/usr/local/cuda/bin" >> $GITHUB_PATH
        echo "NVCC_FLAGS=-allow-unsupported-compiler" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64" >> $GITHUB_ENV
        echo "CPATH=/usr/include/python3.12" >> ${GITHUB_ENV}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ inputs.python-version }}
        activate-environment: true
        working-directory: ${{ inputs.working-directory }}

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv pip install --python="${PYTHON_VERSION}" pip

    - name: Setup PyTorch environment
      shell: bash
      id: setup_pytorch
      env:
        TORCH_VERSION: ${{ inputs.torch-version }}
        TORCH_INDEX: ${{ inputs.torch-index }}
        TORCH_COMPANIONS: ${{ inputs.torch-companions }}
      run: |
        # Install PyTorch first (shared dependency)
        uv pip install packaging wheel setuptools ninja
        if [[ -n "${TORCH_VERSION}" ]]; then
          uv pip install "torch==${TORCH_VERSION}" ${TORCH_COMPANIONS} \
            --index-url "${TORCH_INDEX}"
        else
          uv pip install torch torchvision torchaudio \
            --index-url "${TORCH_INDEX}"
        fi

        # Extract installed version of pytorch to github output
        PYTORCH_VERSION=$(uv run python -c "import torch; print(torch.__version__)")
        echo "pytorch_version=$PYTORCH_VERSION" >> "$GITHUB_OUTPUT"
        echo "PyTorch version: $PYTORCH_VERSION"

    - shell: bash
      run: |
        which g++
        g++ --version

name: Build Wheels

on:
  workflow_dispatch:
  schedule:
    # Build weekly on Sundays
    - cron: "0 4 * * 0"

permissions:
  contents: read

env:
  TORCH_CUDA_ARCH_LIST: "12.0"
  UV_LINK_MODE: copy
jobs:
  setup-environment:
    name: Setup Build Environment
    runs-on: containers-runner
    outputs:
      python-version: ${{ steps.config.outputs.python-version }}
      cuda-version: ${{ steps.config.outputs.cuda-version }}
    steps:
      - id: config
        run: |
          echo "python-version=3.12" >> "$GITHUB_OUTPUT"
          echo "cuda-version=12.9.1" >> "$GITHUB_OUTPUT"

  build-sageattention:
    name: Build SageAttention
    runs-on: containers-runner
    needs: setup-environment

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout SageAttention
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "thu-ml/SageAttention"
          ref: "v2.2.0"
          fetch-depth: 1
          path: "sageattention"
          persist-credentials: false

      - name: Setup Runner
        uses: ./.github/actions/setup-build-cuda
        with:
          python-version: ${{ needs.setup-environment.outputs.python-version }}
          # Stable torch pinned to match the comfyui base image exactly, so the
          # wheel's ABI and CUDA kernels load cleanly there
          torch-version: "2.11.0"
          torch-index: "https://download.pytorch.org/whl/cu128"
          torch-companions: "torchvision==0.26.0 torchaudio==2.11.0"

      - name: Build SageAttention wheel
        run: |
          cd sageattention
          mkdir -p dist
          echo "TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST}"
          python -c "import torch; print(f'torch {torch.__version__}, archs {torch.cuda.get_arch_list()}')"
          python setup.py bdist_wheel -d dist

      - name: Upload SageAttention wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sageattention-wheel
          path: sageattention/dist/*.whl

  publish-container:
    needs: [setup-environment, build-sageattention]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-wheel"
          path: wheels/
          merge-multiple: true

      - name: Create wheel distribution container
        run: |
          # Create Dockerfile for wheel distribution
          cat > Dockerfile << 'EOF'
          FROM scratch
          COPY wheels/ /wheels/
          EOF

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arsac/python_wheels:python-${{ needs.setup-environment.outputs.python-version }}-cuda-${{ needs.setup-environment.outputs.cuda-version }}

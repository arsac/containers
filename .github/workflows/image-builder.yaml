---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Builder

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: Image Name
        required: true
      release:
        type: boolean
        description: Release
        required: true
concurrency:
  group: build-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      app-exists: ${{ steps.app-exists.outputs.exists }}
      platforms: ${{ steps.app-options.outputs.platforms }}
      free-disk-space: ${{ steps.app-options.outputs.free-disk-space }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check For Existing Application
        uses: ./.github/actions/app-exists
        id: app-exists
        with:
          app: ${{ inputs.image }}

      - name: Get Application Options
        id: app-options
        uses: ./.github/actions/app-options
        with:
          app: ${{ inputs.image }}

      - name: Get Application Versions
        uses: ./.github/actions/app-versions
        id: app-versions
        with:
          upstream-version: ${{ steps.app-options.outputs.version }}

      - name: Build Application Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          flavor: latest=false
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.app-versions.outputs.semantic }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.app-versions.outputs.semantic }},enable=${{ steps.app-versions.outputs.is-valid-semver }}
            type=semver,pattern={{major}},value=${{ steps.app-versions.outputs.semantic }},enable=${{ steps.app-versions.outputs.is-valid-semver }}
            type=raw,value=${{ steps.app-versions.outputs.raw }},enable=${{ steps.app-versions.outputs.is-valid-semver }}
            type=raw,value=rolling

      - name: Upload Bake Metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.image }}-bake-metadata
          path: ${{ steps.meta.outputs.bake-file }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs: ["plan"]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.plan.outputs.platforms) }}
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Free Disk Space
        if: ${{ needs.plan.outputs.free-disk-space != 'false' }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true
          android: true
          dotnet: true
          haskell: true

      - name: Additional Cleanup
        if: ${{ needs.plan.outputs.free-disk-space != 'false' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /usr/local/share/edge_driver /usr/local/share/gecko_driver
          sudo rm -rf /usr/share/miniconda /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo rm -rf /imagegeneration
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af --volumes
          echo "=== Final disk space ==="
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Target Architecture
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: target
        env:
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            core.setOutput('arch', process.env.PLATFORM.split('/').pop());

      - name: Get Application Options
        id: app-options
        uses: ./.github/actions/app-options
        with:
          app: ${{ inputs.image }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download Bake Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image }}-bake-metadata
          path: ${{ runner.temp }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check Disk Space
        run: |
          echo "=== Available disk space ==="
          df -h /

      - name: Add Include Directory to Build Context
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          rsync -a --ignore-existing --progress ./include/ "./apps/${IMAGE_NAME}/"

      - name: Prune Docker Builder
        run: |
          docker builder prune -af --keep-storage=2GB || true
          df -h /

      - name: Build Application
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        id: bake
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ runner.temp }}/docker-metadata-action-bake.json
          provenance: false
          set: |
            *.args.VENDOR=${{ github.repository_owner }}
            *.labels.org.opencontainers.image.title=${{ inputs.image }}
            *.labels.org.opencontainers.image.url=https://ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
            *.labels.org.opencontainers.image.version=${{ steps.app-options.outputs.version }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.vendor=${{ github.repository_owner }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/build_cache:${{ inputs.image }}-${{ steps.target.outputs.arch }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/build_cache:${{ inputs.image }}-${{ steps.target.outputs.arch }},mode=max
            *.output=type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
            *.platform=${{ matrix.platform }}
            *.tags=
          source: .
          targets: image
          workdir: ./apps/${{ inputs.image }}

      - name: Export Digest
        id: digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          DIGEST="$(jq --raw-output '.image["containerimage.digest"]' <<< "${METADATA}")"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Cross-image container test: runs per-arch on the native runner whenever
      # the app ships apps/<image>/tests.yaml (container-structure-test or goss).
      # Skipped for apps without one, so it's opt-in and backward-compatible.
      # Gates PRs (incl. renovate auto-merge), catching structural/entry/
      # fail-closed drift a build-only `tsc` gate can't.
      - name: Pull Image For Test
        if: ${{ hashFiles(format('apps/{0}/tests.yaml', inputs.image)) != '' }}
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.digest.outputs.digest }}
        run: docker pull "$IMAGE_REF"

      - name: Test Application
        if: ${{ hashFiles(format('apps/{0}/tests.yaml', inputs.image)) != '' }}
        uses: ./.github/actions/app-tests
        with:
          app: ${{ inputs.image }}
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.digest.outputs.digest }}
          token: ${{ github.token }}

      - name: Upload Digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.image }}-digests-${{ steps.target.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    if: ${{ inputs.release }}
    name: Release
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      APP: ${{ inputs.image }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Bake Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image }}-bake-metadata
          path: ${{ runner.temp }}

      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.image }}-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="ghcr.io/${REPO_OWNER}/${APP}"
          # shellcheck disable=SC2046  # tags and digest refs are intentionally word-split into separate args
          docker buildx imagetools create \
              $(jq --raw-output --compact-output --arg image "${IMAGE}" '.target."docker-metadata-action".tags | map(select(startswith($image)) | "-t " + .) | join(" ")' "${{ runner.temp }}/docker-metadata-action-bake.json") \
              $(printf '%s@sha256:%s ' "${IMAGE}" *)

      - name: Inspect Image
        run: |
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "${{ runner.temp }}/docker-metadata-action-bake.json")
          docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${APP}:${TAG}"

      - name: Export Digest
        id: digest
        run: |
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "${{ runner.temp }}/docker-metadata-action-bake.json")
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${APP}:${TAG}" --format '{{ json . }}' | jq --raw-output '.manifest.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  attest:
    if: ${{ inputs.release }}
    name: Attest
    needs: ["plan", "release"]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      APP: ${{ inputs.image }}
      REPO_OWNER: ${{ github.repository_owner }}
      DIGEST: ${{ needs.release.outputs.digest }}
    steps:
      - name: Free Disk Space
        if: ${{ needs.plan.outputs.free-disk-space != 'false' }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true
          android: true
          dotnet: true
          haskell: true

      - name: Additional Cleanup
        if: ${{ needs.plan.outputs.free-disk-space != 'false' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /usr/local/share/edge_driver /usr/local/share/gecko_driver
          sudo rm -rf /usr/share/miniconda /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo rm -rf /imagegeneration
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af --volumes
          echo "=== Final disk space ==="
          df -h

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Upload Dependency Snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        continue-on-error: true  # SBOM may fail for large images due to disk space
        with:
          dependency-snapshot: true
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ needs.release.outputs.digest }}

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          subject-digest: ${{ needs.release.outputs.digest }}

      - name: Verify Attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh attestation verify --repo "${REPO}" "oci://ghcr.io/${REPO_OWNER}/${APP}@${DIGEST}"

  announce:
    if: ${{ inputs.release && needs.plan.outputs.app-exists != 'true' }}
    name: Announce
    needs: ["plan", "attest"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get Application Options
        id: app-options
        uses: ./.github/actions/app-options
        with:
          app: ${{ inputs.image }}

      - name: Get Release Tag
        uses: ./.github/actions/release-tag
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APP: ${{ inputs.image }}
          SOURCE: ${{ steps.app-options.outputs.source }}
          REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          > [!NOTE]
          > A new application has been added.

          ## 📦 Application

          **Name**: [${APP}](https://github.com/${REPO}/pkgs/container/${APP})
          **Source**: <${SOURCE}>
          EOF
          gh release create "${TAG}" --notes-file release-notes.md

  notify:
    if: ${{ inputs.release && !cancelled() }}
    needs: ["plan", "build", "release", "attest", "announce"]
    name: Notify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: ${{ contains(needs.*.result, 'failure') }}
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ contains(needs.*.result, 'failure') }}
        name: Get Application Options
        id: app-options
        uses: ./.github/actions/app-options
        with:
          app: ${{ inputs.image }}

      - if: ${{ contains(needs.*.result, 'failure') }}
        name: Send Discord Webhook
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          color: "0xFF0000"
          description: |
            Application: `${{ inputs.image }}`
            Version: `${{ steps.app-options.outputs.version }}`
            [Rebuild](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yaml)
          nodetail: true
          title: Container build failed
          username: GitHub Actions
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

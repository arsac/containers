---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Builder

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: Image Name
        required: true
      release:
        type: boolean
        description: Release
        required: true

jobs:
  trivial:
    name: Trivial
    runs-on: ubuntu-latest
    steps:
      - run: echo "called with image=${{ inputs.image }} release=${{ inputs.release }}"

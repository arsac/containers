---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Builder

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: Image Name
        required: true
      release:
        type: boolean
        description: Release
        required: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      app-exists: ${{ steps.app-exists.outputs.exists }}
      platforms: ${{ steps.app-options.outputs.platforms }}
      free-disk-space: ${{ steps.app-options.outputs.free-disk-space }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check For Existing Application
        uses: ./.github/actions/app-exists
        id: app-exists
        with:
          app: ${{ inputs.image }}

      - name: Get Application Options
        id: app-options
        uses: ./.github/actions/app-options
        with:
          app: ${{ inputs.image }}

      - name: Get Application Versions
        uses: ./.github/actions/app-versions
        id: app-versions
        with:
          upstream-version: ${{ steps.app-options.outputs.version }}


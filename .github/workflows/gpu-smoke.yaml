---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: GPU Smoke Test

on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        description: Image ref (tag or ghcr.io/...@sha256:digest)
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ inputs.image }})
    runs-on: containers-runner
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull Image
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "${IMAGE}"

      - name: GPU Assertions
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # -i: connect stdin so the heredoc reaches python inside the container
          docker run -i --gpus all --rm "${IMAGE}" python - <<'PY'
          import torch
          import sageattention

          name = torch.cuda.get_device_name(0)
          archs = torch.cuda.get_arch_list()
          print(f"GPU: {name}")
          print(f"torch: {torch.__version__}, archs: {archs}")
          assert "sm_120" in archs, f"sm_120 missing: {archs}"

          x = torch.rand(1024, 1024, device="cuda")
          y = x @ x.t()
          assert y.sum().isfinite(), "matmul produced non-finite values"
          from importlib.metadata import version
          print("sageattention:", version("sageattention"))
          print("GPU assertions OK")
          PY

      - name: ComfyUI Boot Check
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker run --gpus all -d --name gpu-smoke \
            -v /tmp/gpu-smoke-config:/config \
            "${IMAGE}"
          # ComfyUI imports torch, creates its venv and boots the server
          for i in $(seq 1 36); do
            if docker exec gpu-smoke curl -sf http://localhost:8188/ >/dev/null 2>&1; then
              echo "ComfyUI responding after ~$((i * 5))s"
              docker logs gpu-smoke 2>&1 | grep -E "sageattention|SageAttention|To see the GUI" | head -5 || true
              docker rm -f gpu-smoke >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "ComfyUI did not respond within 180s; last logs:"
          docker logs --tail 40 gpu-smoke 2>&1
          docker rm -f gpu-smoke >/dev/null || true
          exit 1

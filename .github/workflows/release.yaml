---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: ["main"]
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      image:
        type: string
        description: Image name (e.g., "comfyui")
        required: true
      release:
        type: boolean
        description: Release (uncheck only for testing builds without pushing tags)
        required: false
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      changed-apps: ${{ steps.changed-apps.outputs.changed_files }}
    steps:
      - name: Get Changed Apps
        id: changed-apps
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          path: apps
          include_only_directories: true
          max_depth: 1

  build-apps:
    uses: ./.github/workflows/image-builder.yaml
    with:
      image: comfyui
      release: false

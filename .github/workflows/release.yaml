---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: ["main"]
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      image:
        type: string
        description: Image name (e.g., "comfyui")
        required: true
      release:
        type: boolean
        description: Release (uncheck only for testing builds without pushing tags)
        required: false
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe ${{ inputs.image }}"
